<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 290" width="250" height="290">
  <!-- No background — transparent -->

  <g transform="translate(125, 178)">
    <!-- Far left small tower -->
    <rect x="-56" y="10"  width="14" height="40" rx="1.5" fill="#C9943A" opacity="0.45"/>
    <rect x="-54" y="6"   width="10" height="6"  rx="1"   fill="#C9943A" opacity="0.45"/>

    <!-- Left-mid tower -->
    <rect x="-36" y="-28" width="18" height="78" rx="1.5" fill="#C9943A" opacity="0.7"/>
    <rect x="-33" y="-36" width="12" height="10" rx="1"   fill="#C9943A" opacity="0.7"/>
    <rect x="-29" y="-50" width="4"  height="16" rx="1"   fill="#E8B84B" opacity="0.8"/>

    <!-- Center hero tower -->
    <rect x="-12" y="-80" width="24" height="130" rx="2" fill="#C9943A"/>
    <!-- stepped top -->
    <rect x="-8"  y="-96"  width="16" height="18" rx="1.5" fill="#C9943A"/>
    <rect x="-4"  y="-112" width="8"  height="18" rx="1"   fill="#C9943A"/>
    <!-- spire -->
    <rect x="-1.5" y="-128" width="3" height="18" rx="1" fill="#E8B84B"/>
    <!-- beacon dot -->
    <circle cx="0" cy="-130" r="3.5" fill="#E8B84B"/>
    <!-- windows center tower -->
    <rect x="-8"  y="-72" width="5" height="5" rx="0.5" fill="#2a1a08"/>
    <rect x="3"   y="-72" width="5" height="5" rx="0.5" fill="#E8B84B" opacity="0.9"/>
    <rect x="-8"  y="-60" width="5" height="5" rx="0.5" fill="#E8B84B" opacity="0.8"/>
    <rect x="3"   y="-60" width="5" height="5" rx="0.5" fill="#2a1a08"/>
    <rect x="-8"  y="-48" width="5" height="5" rx="0.5" fill="#E8B84B" opacity="0.9"/>
    <rect x="3"   y="-48" width="5" height="5" rx="0.5" fill="#E8B84B" opacity="0.7"/>
    <rect x="-8"  y="-36" width="5" height="5" rx="0.5" fill="#2a1a08"/>
    <rect x="3"   y="-36" width="5" height="5" rx="0.5" fill="#E8B84B" opacity="0.9"/>
    <rect x="-8"  y="-24" width="5" height="5" rx="0.5" fill="#E8B84B" opacity="0.6"/>
    <rect x="3"   y="-24" width="5" height="5" rx="0.5" fill="#2a1a08"/>

    <!-- Right-mid tower -->
    <rect x="18"  y="-28" width="18" height="78" rx="1.5" fill="#C9943A" opacity="0.7"/>
    <rect x="21"  y="-36" width="12" height="10" rx="1"   fill="#C9943A" opacity="0.7"/>
    <rect x="25"  y="-50" width="4"  height="16" rx="1"   fill="#E8B84B" opacity="0.8"/>

    <!-- Far right small tower -->
    <rect x="42"  y="10"  width="14" height="40" rx="1.5" fill="#C9943A" opacity="0.45"/>
    <rect x="44"  y="6"   width="10" height="6"  rx="1"   fill="#C9943A" opacity="0.45"/>

    <!-- Ground baseline -->
    <rect x="-72" y="50"  width="144" height="3" rx="1.5" fill="#C9943A"/>
    <rect x="-52" y="56"  width="104" height="1" rx="0.5" fill="#C9943A" opacity="0.4"/>

    <!-- LS wordmark -->
    <text x="0" y="84" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#C9943A" letter-spacing="8">LS</text>
  </g>
